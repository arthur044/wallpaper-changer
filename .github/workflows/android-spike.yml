# Spike (CI plan, steps 1-3): builds on a GitHub runner (AGP 9.4.1, Gradle
# 9.7.1, compileSdk 37), with the version from git and both APKs signed with
# the real keys. Replaced by the release and debug workflows in later steps.
name: Android spike

on:
  push:
    branches: [ci/android-spike]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
        with:
          # versionCode counts commits: the build refuses a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Print version
        run: ./gradlew -q :app:printVersion

      - name: Set up signing from secrets
        run: ci/write-signing.sh
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}

      - name: Assemble debug and release APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Verify signatures
        run: |
          ci/verify-apk-cert.sh release app/build/outputs/apk/release/app-release.apk
          ci/verify-apk-cert.sh debug app/build/outputs/apk/debug/app-debug.apk
          # Negative control: the check must reject an APK of the other key.
          if ci/verify-apk-cert.sh release app/build/outputs/apk/debug/app-debug.apk; then
            echo "verify-apk-cert.sh accepted the debug APK as release" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: apks
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          retention-days: 7

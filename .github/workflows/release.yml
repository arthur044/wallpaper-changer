# Release channel: every push to main builds the signed release APK and
# publishes it as the GitHub Release r<versionCode>, marked latest, with the
# update.json the app reads.
#
# The release key only exists in the "release" environment, whose deployment
# branch is main: no other branch's code (build script, ci/*.sh) ever runs
# with it, whatever this file says there.
name: Android release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# One release at a time, in push order; never cancel one halfway.
concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      # Actions pinned by commit: a moved tag must not reach the signing key.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # versionCode counts commits: the build refuses a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Print version
        run: ./gradlew -q :app:printVersion

      - name: Test and lint
        run: ./gradlew :core:test :app:testDebugUnitTest :app:lintDebug

      - name: Set up signing from secrets
        run: ci/write-signing.sh
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          # Not a secret; as one, GitHub would mask the repo name in every log.
          RELEASE_KEY_ALIAS: wallpaper-changer
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease

      # Right after the only step that needs it, and even if it failed.
      - name: Delete the signing key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP"/*.jks keystore.properties

      - name: Verify signature
        run: ci/verify-apk-cert.sh release app/build/outputs/apk/release/app-release.apk

      - name: Stage APK and update.json
        id: stage
        run: |
          apk="$(ci/write-update-json.sh release app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/publish")"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          echo "version_code=$(jq -r .versionCode "$RUNNER_TEMP/publish/update.json")" >> "$GITHUB_OUTPUT"
          echo "version_name=$(jq -r .versionName "$RUNNER_TEMP/publish/update.json")" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_CODE: ${{ steps.stage.outputs.version_code }}
          TITLE: ${{ steps.stage.outputs.version_name }}
          APK: ${{ steps.stage.outputs.apk }}
        run: |
          tag="r$VERSION_CODE"
          # A rerun of an old run must not make an older build "latest".
          newest="$(gh release list --limit 100 --exclude-pre-releases --json tagName -q '.[].tagName' |
            sed -n 's/^r\([0-9][0-9]*\)$/\1/p' | sort -n | tail -1)"
          if [ -n "$newest" ] && [ "$newest" -gt "$VERSION_CODE" ]; then
            echo "r$newest is newer than $tag: not publishing"
            exit 0
          fi
          # A rerun of the same commit has the same versionCode: replace it.
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release delete "$tag" --yes --cleanup-tag
          fi
          gh release create "$tag" "$APK" "$RUNNER_TEMP/publish/update.json" \
            --target "$GITHUB_SHA" --title "$TITLE" --notes "$(git log -1 --format=%B)" --latest

# Release channel: every push to main builds the signed release APK and
# publishes it as the GitHub Release r<versionCode>, marked latest, with the
# update.json the app reads. Run by hand on another branch, it does all of
# that except publishing (a dry run), so the channel only ever gets main.
name: Android release

on:
  push:
    # ci/android-spike: temporary, for dry runs until this workflow is on main
    # (GitHub can't dispatch a workflow the default branch doesn't have).
    branches: [main, ci/android-spike]
  workflow_dispatch:

permissions:
  contents: write

# One release at a time, in push order; never cancel one halfway.
concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
        with:
          # versionCode counts commits: the build refuses a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Print version
        run: ./gradlew -q :app:printVersion

      - name: Test and lint
        run: ./gradlew :core:test :app:testDebugUnitTest :app:lintDebug

      - name: Set up signing from secrets
        run: ci/write-signing.sh
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          # Not a secret; as one, GitHub would mask the repo name in every log.
          RELEASE_KEY_ALIAS: wallpaper-changer
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease

      - name: Verify signature
        run: ci/verify-apk-cert.sh release app/build/outputs/apk/release/app-release.apk

      - name: Stage APK and update.json
        id: stage
        run: |
          apk="$(ci/write-update-json.sh release app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/publish")"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          echo "version_code=$(jq -r .versionCode "$RUNNER_TEMP/publish/update.json")" >> "$GITHUB_OUTPUT"
          echo "version_name=$(jq -r .versionName "$RUNNER_TEMP/publish/update.json")" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: r${{ steps.stage.outputs.version_code }}
          TITLE: ${{ steps.stage.outputs.version_name }}
          APK: ${{ steps.stage.outputs.apk }}
        run: |
          # A rerun of the same commit has the same versionCode: replace it.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          gh release create "$TAG" "$APK" "$RUNNER_TEMP/publish/update.json" \
            --target "$GITHUB_SHA" --title "$TITLE" --notes "$(git log -1 --format=%B)" --latest

      - name: Keep the dry run's output
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: release-dry-run
          path: ${{ runner.temp }}/publish/
          retention-days: 7
